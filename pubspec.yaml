name: doc_scanner_app
description: "DocAction - Professional AI Document Scanner & PDF Hub"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  intl: ^0.20.2
  image: ^4.1.3
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  camera: ^0.11.0+2
  pdf: ^3.11.0
  file_picker: ^8.0.0
  printing: ^5.13.0
  share_plus: ^12.0.2
  signature: ^6.3.0
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_barcode_scanning: ^0.14.2
  uuid: ^4.3.3
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.2
  vibration: ^3.1.8
  permission_handler: ^12.0.1
  syncfusion_flutter_pdf: ^33.1.49
  reorderable_grid_view: ^2.2.8
  archive: ^3.3.6
  ffi: ^2.1.2
  lucide_icons: ^0.257.0
  docx_to_text: 1.0.1
  shared_preferences: ^2.5.5
  local_auth: ^3.0.1
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  flutter_staggered_grid_view: ^0.7.0
  device_info_plus: ^12.4.0
  flutter_screenutil: ^5.9.3
  package_info_plus: ^8.2.0
  flutter_quill: ^11.5.0
  opencv_dart: ^2.2.1+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/app_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo/app_logo.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    image: assets/logo/app_logo.png
    color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/images/
    - assets/models/
